<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 대비</title>
</head>

<body>
    <script>
        // 1번 문제
        function truncateTitle(title, maxLength) {
            if (title.length > maxLength) {
                // [빈칸 1] 코드를 완성하세요.
                let str = title.slice(0, maxLength);
                str += "......";
                return str;
            }
            return title;
        }

        // 테스트 실행
        const text = "자바스크립트 실무 마스터 : 기초에서 심화까지 한 번에 끝내기";
        console.log("문제1")
        console.log(truncateTitle(text, 10)); // 출력 예시: "자바스크립트......"

        // 2번 문제
        let tel = "010-1234-5678";

        // [빈칸 2] 정규식을 이용해 숫자가 아닌 문자를 모두 빈 문자열("")로 치환하세요.
        let cleanTel = tel.replace("-", "");

        console.log("문제2");
        console.log(cleanTel); // 출력 예시: "01012345678"

        // 3번 문제
        let memberId = 45;

        // [빈칸 3] 변환 및 포맷팅 로직을 작성하세요.
        let memberCode = "MN-" + memberId.toString().padStart(6, "0");
        console.log("문제3")
        console.log(memberCode); // 출력 예시: "MN-000045"

        // 4번 문제
        const url = "https://example.com/shop/clothing/tshirt";
        let pageSegment = url.split("/");
        let size = pageSegment.length;

        // [빈칸 4] 배열의 전체 길이를 활용해 뒤에서 두 번째인 'clothing'을 추출하여 출력하세요.
        let category = pageSegment[size - 2];

        console.log("문제4")
        console.log(`카테고리 : ${category}`); // 출력 예시: "카테고리 : clothing"

        // 5번 문제
        const checkFileName = (fileName) => {
            // 1. 대소문자 구분을 없애기 위해 모두 소문자로 변환
            let lowerFile = fileName.toLowerCase();

            // 2. 소문자로 변환된 파일명이 .png 또는 .jpg로 끝나는지 판별
            if (lowerFile.endsWith(".png") || lowerFile.endsWith(".jpg")) {
                return true;
            }
            return false;
        };

        console.log("문제5")
        console.log(checkFileName("profile.PNG")); // 출력 예시: true

        // 6번 문제
        function doSum(n1, n2) {
            // n1.value와 n2.value는 문자열 상태입니다.
            // [빈칸 6] 두 값을 정수로 형 변환하여 더한 값을 결과창에 뿌려주세요.
            let v1 = parseInt(n1);
            let v2 = parseInt(n2);

            return (v1 + v2);
        }
        console.log("문제6")
        console.log(doSum(1, 2));

        // 7번 문제
        let price = 1250.756;

        // [빈칸 7] 소수점 아래 2자리까지 반올림하여 문자열로 변환하는 메서드를 적으세요.
        let formattedPrice = price.toFixed(2);
        console.log("문제7");
        console.log(formattedPrice); // 출력 예시: "1250.76"
        // 8번 문제
        let product = [
            { id: 1, name: '맥북 프로', category: 'electronics', price: 2500000 },
            { id: 2, name: '아이패드 에어', category: 'electronics', price: 900000 },
            { id: 3, name: '기계식 키보드', category: 'accessories', price: 150000 },
        ];

        // [빈칸 8] 고차함수 filter를 사용하여 조건에 맞는 요소만 추출하세요.
        let electronicsList = product.filter(item => item.category === 'electronics');
        console.log("문제8")
        console.log(electronicsList.length); // 출력 예시: 2
        // 9번 문제
        let cart = [
            { name: '맥북 프로', price: 2500000 },
            { name: '아이패드 에어', price: 900000 },
            { name: '기계식 키보드', price: 150000 },
        ];

        // [빈칸 9] 누적값(sum)에 현재 상품의 가격(item.price)을 더해나가는 콜백 함수와 초기값을 작성하세요.
        let totalSum = cart.reduce((sum, item) => sum += item.price, 0);
        console.log("문제9")
        console.log(totalSum); // 출력 예시: 3550000
        // 10번 문제
        let now = new Date(); // 현재 날짜 객체 생성

        // 일주일 뒤의 날짜를 계산하여 설정하기
        // [빈칸 10] 현재 일자에 7을 더해 다시 셋팅하는 메서드 조합을 완성하세요.
        now.setDate(now.getDate() + 7);

        // YYYY-MM-DD 포맷팅용 변수 추출
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, "0");
        let date = String(now.getDate()).padStart(2, "0");
        console.log("문제10")
        console.log(`${year}-${month}-${date}`); // 오늘이 2026-06-15 라면 출력 예시: "2026-06-22"
    </script>
</body>

</html>
