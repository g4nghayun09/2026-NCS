<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>array_object</title>
        <style>
            .table1 {
                width: 200px;
                border: 1px solid black;
                margin-top: 10px;
                border-collapse: collapse; /*중복되는 선 제거*/
            }
            .table1 th {
                border: 1px solid black;
                background-color: hotpink;
            }
            .table1 td {
                text-align: center;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <select name="drinkType", id="drinkType"></select>
        <br/>
        <button onclick="search1()">조회1(문자열)</button>
        <button onclick="search2()">조회2(push, join)</button>

        <table class="table1">
            <thead>
                <th>학번</th>
                <th>이름</th>
            </thead>
            <body>
                <tr>
                    <td>2101</td>
                    <td>강하윤</td>
                </tr>
                <tr>
                    <td>2102</td>
                    <td>김기범</td>
                </tr>
                <tr>
                    <td>2103</td>
                    <td>김진수</td>
                </tr>
            </body>
        </table>
        <!-- db에서 불러올 데이터를 보여줄 테이블 -->
        <table class="table1">
            <thead>
                <th>음료</th>
                <th>가격</th>
            </thead>
            <tbody id="tbody1"></tbody>
        </table>
        <script>
            // 자바스크립트 실무에서 가장 많이 사용하는 객체
            let brands = [
                "애플",
                "삼성",
                "메타",
                "삼성",
                "아마존",
                "마이크로소프트",
            ];

            // 1. toString() : 쉼표를 기준으로 하나의 문자열로 변환
            console.log(brands.toString()); // 애플,삼성,메타,삼성,아마존,마이크로소프트

            // 2. join() : 파라미터로 전달된 문자를 이용해서 하나의 문자열로 합치기
            console.log(brands.join("")); // 애플삼성메타삼성아마존마이크로소프트
            console.log(brands.join("-")); // 애플-삼성-메타-삼성-아마존-마이크로소프트

            // 2-1. += => db에서 데이터를 읽어와 동적으로 표를 이요애서 출력
            // 장점 : 가독성 , 단점 : 성능저하
            const search1 = () => {
                // 1. 데이터 읽어오기
                const drinkList = [
                    { name: "오렌지", price: 1000 },
                    { name: "파워에이드", price: 1200 },
                    { name: "커피", price: 700 },
                    { name: "보리음료", price: 1200 },
                    { name: "코카콜라", price: 1800 },
                ];
                // 2. 데이터 수에 맞게 태그 생성
                let tagsStr = "";
                for (drink of drinkList) {
                    tagsStr += "<tr>";
                    tagsStr += "<td>" + drink.name + "</td>";
                    tagsStr += "<td>" + drink.price + "</td>";
                    tagsStr += "</tr>";
                }
                console.log(tagsStr);
                // 3. 태그 랜더링(innerHTML)해서 화면에 뿌리기
                document.getElementById("tbody1").innerHTML = tagsStr;
            };

            // 2-2. join()실무 활용예제 => db에서 데이터를 읽어와 동적으로 표를 이요애서 출력
            // push(), join()
            // 장점 : 성능, 단점 : x
            const search2 = () => {
                // 1. 데이터 읽어오기
                const drinkList = [
                    { name: "오렌지", price: 1000 },
                    { name: "파워에이드", price: 1200 },
                    { name: "커피", price: 700 },
                    { name: "보리음료", price: 1200 },
                    { name: "코카콜라", price: 1800 },
                ];
                // 2. 데이터 수에 맞게 태그 생성
                let tagsStr = [];
                for (drink of drinkList) {
                    // tagsStr.push("<tr>");
                    // tagsStr.push("<td>" + drink.name + "</td>");
                    // tagsStr.push("<td>" + drink.price + "</td>");
                    // tagsStr.push("</tr>");
                    tagsStr.push(
                        `<tr> <td> ${drink.name} </td> <td> ${drink.price} </td> </tr>`,
                    );
                }
                console.log(tagsStr.join(" "));
                // 3. 태그 랜더링(innerHTML)해서 화면에 뿌리기
                document.getElementById("tbody1").innerHTML = tagsStr.join(" ");
            };
            // 3. pop() : 배열의 마지막 요소 삭제, 리턴 : 마지막 요소
            brands = [
                "애플",
                "삼성",
                "메타",
                "삼성",
                "아마존",
                "마이크로소프트",
            ];
            console.log(brands.pop()); // 마이크로소프트
            console.log(brands); // ['애플', '삼성', '메타', '삼성', '아마존']

            // 4. push() : 배열의 마지막에 요소 추가, 리턴 : 길이 + join()
            console.log(brands.push("테슬라")); // 6 - 길이가 나옴
            console.log(brands); // ['애플', '삼성', '메타', '삼성', '아마존', '테슬라']

            // 5. nushift() : 배열의 처음에 요소 추가, 리턴 : 길이
            // 단점 : 실무 활용도 낮음. => 배열을 하니씩 이동시키기 때문임.
            console.log(brands.unshift("하이닉스")); // 7 - 길이가 나옴
            console.log(brands); // ['하이닉스', '애플', '삼성', '메타', '삼성', '아마존', '테슬라']

            // 5-1. unshift() : 실무 활용
            function loadDrinkList() {
                const types = [
                    { text: "이온음료", code: "A" },
                    { text: "커피", code: "B" },
                    { text: "콜라", code: "C" },
                    // { text: "레몬에이드", code: "L" },
                ];
                types.unshift({ text: "쥬스", code: "D" });
                const tags = [];
                for( type of types ) {
                    tags.push("<option value= " + type.code + ">" + type.text + "</option>");
                }
                return tags;
            }
            const tagsList = loadDrinkList(); // 배열 형식
            // console.log(tagsList);
            document.getElementById("drinkType").innerHTML = tagsList.join("");
            // 
        </script>
    </body>
</html>
