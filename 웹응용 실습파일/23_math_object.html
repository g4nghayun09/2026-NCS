<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>math</title>
  </head>
  <body>
    <script>
      // 선언 필요 없음 그냥 사용 가능

      // 1. round()
      console.log(Math.round(2.1)); // 2
      console.log(Math.round(9.9)); // 10

      // 2. ceil()
      console.log(Math.ceil(2.1)); // 3
      console.log(Math.ceil(9.9)); // 10
      // 페이징 : 게시글이 51개 => 10개씩 게시 => 페이지 8개 필요

      let total = 51;
      let contPerPage = 10;
      let totalPage = Math.ceil(total / contPerPage);
      console.log(`총 ${totalPage}의 페이지 필요`);

      // 3. floor()
      console.log(Math.floor(2.1)); // 2
      console.log(Math.floor(9.9)); // 9
      console.log(Math.floor(-2.1)); // -3
      console.log(Math.floor(-9.9)); // -10

      // 4. trunk() : 소수점 이하는 잘라내기
      console.log(Math.trunc(2.1)); // 2
      console.log(Math.trunc(9.9)); // 9
      console.log(Math.trunc(-2.1)); // -2
      console.log(Math.trunc(-9.9)); // -9

      // 5. sign() : 부호를 알려줌
      console.log(Math.sign(2)); // 1
      console.log(Math.sign(-9)); // -1
      console.log(Math.sign(0)); // 0

      // 6. pow() : 제곱
      console.log(Math.pow(2, 5)); // 32

      // 7. sqrt() : 제곱근
      console.log(Math.sqrt(64)); // 8
      console.log(Math.sqrt(7)); // 2.6457513110645907

      // 8.abs() : 절댓값
      console.log(Math.abs(123)); // 123
      console.log(Math.abs(-123)); // 123

      // 9.min()
      console.log(Math.min(1, 2, 3, 4, 5, 99, 999)); // 1

      // 10.max()
      console.log(Math.max(1, 2, 3, 4, 5, 99, 999)); // 999

      // 11. random() : 0<= 임의 수 <1
      console.log(Math.random());

      // 과제 
      // 활용 1. 0~9 (오직 정수만)
      console.log(Math.round(Math.random()*10));
      // 활용 2. 1~10
      console.log(Math.ceil(Math.random()*10));
      // 활용 3. 1~100
      console.log(Math.ceil(Math.random()*100));
      // 활용 4. min과 max의 값중 임의의 수를 발생시키는 함수 getRandomInteger(min, max) 작성. 오직 양정수만
      getRandomInteger(11, 20);
      function getRandomInteger(min, max) {
        console.log(Math.round(Math.random()*(max-min))+min);
      }
    </script>
  </body>
</html>
